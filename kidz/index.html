<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AJ Kidz Zone</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

</head>

<body>

<header>

  <div class="site-name">
    AJ STORES
  </div>

  <nav>

    <a href="../">
      Home
    </a>

    <a href="../trendy/">
      AJ Trendy Hub
    </a>

    <a href="../kidz/">
      AJ Kidz Zone
    </a>

  </nav>

</header>


<main>

  <h1>
    AJ Kidz Zone
  </h1>

  <p>
    Kids toys, accessories ও অন্যান্য শিশুদের পণ্য।
  </p>

  <h2>
    Products
  </h2>

  <section id="products">

    <p class="loading">
      Product load হচ্ছে...
    </p>

  </section>

</main>


<div id="productViewer"></div>


<div id="modal">

  <form id="orderForm">

    <h2>
      অর্ডার করুন
    </h2>

    <p>
      Product:
      <strong id="orderProductName"></strong>
    </p>

    <p>
      Price:
      ৳<strong id="orderProductPrice"></strong>
    </p>


    <input
      type="hidden"
      id="product"
    >

    <input
      type="hidden"
      id="price"
    >


    <div id="colorWrap">

      <label>
        Color
      </label>

      <select id="orderColor"></select>

    </div>


    <label>
      আপনার নাম
    </label>

    <input
      type="text"
      id="name"
      required
    >


    <label>
      মোবাইল নম্বর
    </label>

    <input
      type="tel"
      id="phone"
      required
    >


    <label>
      ঠিকানা
    </label>

    <textarea
      id="address"
      rows="3"
      required
    ></textarea>


    <label>
      ডেলিভারি এলাকা
    </label>

    <select
      id="deliveryArea"
      required
    >

      <option value="">
        নির্বাচন করুন
      </option>

      <option value="ঢাকার ভিতরে">
        ঢাকার ভিতরে — ৳60
      </option>

      <option value="ঢাকার বাইরে">
        ঢাকার বাইরে — ৳120
      </option>

    </select>


    <p>
      Delivery Charge:
      ৳<span id="deliveryCharge">0</span>
    </p>

    <p>
      Total:
      ৳<strong id="totalPrice">0</strong>
    </p>


    <button type="submit">
      অর্ডার কনফার্ম করুন
    </button>


    <p id="status"></p>

  </form>

</div>


<script src="../script.js"></script>

</body>

</html>
