<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AJ Kidz Zone</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topbar">
  <a class="brand" href="../">AJ <span>STORES</span></a>

  <nav>
    <a href="../trendy/">AJ Trendy Hub</a>
    <a class="active" href="../kidz/">AJ Kidz Zone</a>
  </nav>
</header>

<section class="shop-hero kidz-bg">
  <p class="eyebrow">AJ STORES</p>
  <h1>AJ Kidz Zone</h1>
  <p>শিশুদের জন্য মজার ও প্রয়োজনীয় পণ্য।</p>
</section>

<main class="shop">

  <h2>Products</h2>

  <div id="products" class="products">
    <p class="loading">Product load হচ্ছে...</p>
  </div>

  <p class="note">
   
  </p>

</main>

<div id="modal" class="modal">

  <div class="modal-box">

    <button class="close" onclick="closeOrder()">×</button>

    <h2>অর্ডার করুন</h2>

    <form id="orderForm">

      <input type="hidden" id="product">
      <input type="hidden" id="price">

      <div class="order-summary">
        <b id="orderProductName"></b>
        <span>
          পণ্যের দাম: ৳<span id="orderProductPrice"></span>
        </span>
      </div>

      <label>
        আপনার পূর্ণ নাম
        <input id="name" placeholder="আপনার পূর্ণ নাম" required>
      </label>

      <label>
        মোবাইল নম্বর
        <input id="phone" placeholder="01XXXXXXXXX" required type="tel">
      </label>

      <label>
        ডেলিভারি এলাকা
        <select id="deliveryArea" required>
          <option value="">এলাকা নির্বাচন করুন</option>
          <option value="ঢাকার ভিতরে">ঢাকার ভিতরে — ৳60</option>
          <option value="ঢাকার বাইরে">ঢাকার বাইরে — ৳120</option>
        </select>
      </label>

      <label>
        পূর্ণ ঠিকানা
        <textarea id="address" placeholder="বাড়ি/রোড/এলাকা/থানা/জেলা সহ পূর্ণ ঠিকানা" required></textarea>
      </label>

      <div class="total-box">
        পণ্যের দাম: ৳<span id="summaryPrice">0</span><br>
        ডেলিভারি চার্জ: ৳<span id="deliveryCharge">0</span>
        <hr>
        <b>সর্বমোট: ৳<span id="totalPrice">0</span></b>
      </div>

      <button class="submit" type="submit">
        অর্ডার কনফার্ম করুন
      </button>

      <p id="status"></p>

    </form>

  </div>

</div>

<script src="../script.js"></script>

</body>
</html>
