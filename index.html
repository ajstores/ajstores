<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AJ STORES</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<header>

  <div class="site-name">
    AJ STORES
  </div>

  <nav>

    <a href="./">
      Home
    </a>

    <a href="trendy/">
      AJ Trendy Hub
    </a>

    <a href="kidz/">
      AJ Kidz Zone
    </a>

  </nav>

</header>


<main>

  <div class="home-intro">

    <p>
      WELCOME TO AJ STORES
    </p>

    <h1>
      Shop what you love.
    </h1>

    <p>
      দুইটি ব্র্যান্ড, একটি সহজ shopping website.
    </p>

  </div>


  <section class="brand-grid">


    <!-- AJ TRENDY HUB -->

    <a
      class="brand-card"
      href="trendy/"
    >

      <img
        src="aj-trendy-hub-logo.jpg"
        alt="AJ Trendy Hub"
      >

      <h2>
        AJ Trendy Hub
      </h2>

      <p>
        Bags, wallets & everyday fashion accessories.
      </p>

      <div class="shop-link">
        Shop Bags →
      </div>

    </a>


    <!-- AJ KIDZ ZONE -->

    <a
      class="brand-card"
      href="kidz/"
    >

      <img
        src="aj-kidz-zone-logo.jpg"
        alt="AJ Kidz Zone"
      >

      <h2>
        AJ Kidz Zone
      </h2>

      <p>
        Toys, kids items & accessories.
      </p>

      <div class="shop-link">
        Shop Kids Products →
      </div>

    </a>


  </section>

</main>

</body>

</html>
