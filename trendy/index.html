<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AJ Trendy Hub</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <style>

    /* =========================
       ORDER MODAL HIDDEN
    ========================= */

    #modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.72);
      padding: 15px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }

    #modal form {
      width: min(430px, 94vw);
      max-height: 90vh;
      overflow-y: auto;
      margin: auto;
      box-sizing: border-box;
    }


    /* =========================
       PRODUCT VIEWER
    ========================= */

    #productViewer {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.78);
      overflow-y: auto;
    }

    #productViewer .large-product-box {
      width: min(480px, 94vw);
      max-width: 480px;
      max-height: 92vh;
      overflow-y: auto;
      box-sizing: border-box;
      margin: auto;
    }

    #productViewer .product-slider {
      width: 100%;
      max-height: 350px;
      overflow: hidden;
      box-sizing: border-box;
    }

    #productViewer .product-slider img {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
      display: block;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      #productViewer {
        padding: 8px;
      }

      #productViewer .large-product-box {
        width: 96vw;
        max-width: 96vw;
        max-height: 94vh;
        border-radius: 16px;
      }

      #productViewer .product-slider {
        max-height: 260px;
      }

      #productViewer .product-slider img {
        max-height: 250px;
      }

      #modal {
        padding: 10px;
      }

      #modal form {
        width: 96vw;
        max-height: 92vh;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="site-name">
    AJ STORES
  </div>

  <nav>

    <a href="../">
      Home
    </a>

    <a href="../trendy/">
      AJ Trendy Hub
    </a>

    <a href="../kidz/">
      AJ Kidz Zone
    </a>

  </nav>

</header>


<main>

  <h1>
    AJ Trendy Hub
  </h1>

  <p>
    ব্যাগ, ওয়ালেট ও দৈনন্দিন ফ্যাশন পণ্য।
  </p>


  <h2>
    Products
  </h2>


  <section id="products">

    <p class="loading">
      Product load হচ্ছে...
    </p>

  </section>

</main>



<!-- =========================
     PRODUCT VIEWER
========================= -->

<div id="productViewer"></div>



<!-- =========================
     ORDER MODAL
========================= -->

<div
  id="modal"
  style="display:none;"
>

  <form id="orderForm">

    <h2>
      অর্ডার করুন
    </h2>


    <p>
      Product:
      <strong id="orderProductName"></strong>
    </p>


    <p>
      Price:
      ৳<strong id="orderProductPrice"></strong>
    </p>


    <input
      type="hidden"
      id="product"
    >


    <input
      type="hidden"
      id="price"
    >



    <!-- COLOR -->

    <div id="colorWrap">

      <label>
        Color
      </label>

      <select id="orderColor"></select>

    </div>



    <!-- NAME -->

    <label>
      আপনার নাম
    </label>

    <input
      type="text"
      id="name"
      required
    >



    <!-- PHONE -->

    <label>
      মোবাইল নম্বর
    </label>

    <input
      type="tel"
      id="phone"
      required
    >



    <!-- ADDRESS -->

    <label>
      ঠিকানা
    </label>

    <textarea
      id="address"
      rows="3"
      required
    ></textarea>



    <!-- DELIVERY AREA -->

    <label>
      ডেলিভারি এলাকা
    </label>

    <select
      id="deliveryArea"
      required
    >

      <option value="">
        নির্বাচন করুন
      </option>

      <option value="ঢাকার ভিতরে">
        ঢাকার ভিতরে — ৳60
      </option>

      <option value="ঢাকার বাইরে">
        ঢাকার বাইরে — ৳120
      </option>

    </select>



    <!-- DELIVERY CHARGE -->

    <p>
      Delivery Charge:
      ৳<span id="deliveryCharge">0</span>
    </p>



    <!-- TOTAL -->

    <p>
      Total:
      ৳<strong id="totalPrice">0</strong>
    </p>



    <!-- SUBMIT -->

    <button type="submit">
      অর্ডার কনফার্ম করুন
    </button>



    <!-- STATUS -->

    <p id="status"></p>

  </form>

</div>



<script src="../script.js"></script>


</body>

</html>
